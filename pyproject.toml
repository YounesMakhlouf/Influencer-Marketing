[project]
name = "influencer-marketing"
version = "1.0.0"
description = "Instagram influencer topic classification using BERTopic"
requires-python = ">=3.10,<3.14"
readme = "README.md"

dependencies = [
    # Web framework
    "Flask>=3.0.3",
    "httpx>=0.27.0",
    "gunicorn>=22.0.0",

    # ML / Topic modelling
    "bertopic>=0.16.2",
    "torch>=2.3.0",
    "transformers>=4.41.2",
    "scikit-learn>=1.5.0",

    # NLP
    "spacy>=3.7.4",
    "nltk>=3.8.1",
    "deep-translator>=1.11.4",
    "Unidecode>=1.3.8",

    # Data
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "jmespath>=1.0.1",
    "pymongo>=4.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.uv]
# Python version pinned via .python-version file

[tool.ruff]
target-version = "py310"
line-length = 120
